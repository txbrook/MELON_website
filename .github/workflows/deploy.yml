name: Deploy site (landing + Sphinx tutorials)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Build Sphinx tutorials
        run: sphinx-build -b html docs docs/_build/html

      - name: Assemble site
        run: |
          mkdir -p _site
          # Copy static landing page (everything at repo root except docs/, _site/, hidden dirs)
          rsync -a \
            --exclude='docs' \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.DS_Store' \
            ./ _site/
          # Put Sphinx output under /tutorials
          mkdir -p _site/tutorials
          cp -R docs/_build/html/. _site/tutorials/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
