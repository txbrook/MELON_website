name: Deploy site (landing + notebook tutorials)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MELON_NOTEBOOK_REF: 65f83871ccb242498a3c0d50fb10d043c265bb52

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: txbrook/MELON
          ref: ${{ env.MELON_NOTEBOOK_REF }}
          path: .notebook-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /Reproduce/*/analysis.ipynb

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install Sphinx dependencies
        run: pip install -r docs/requirements.txt

      - name: Render notebook code and existing outputs
        run: python scripts/render_notebooks.py --notebook-root .notebook-source --ref "$MELON_NOTEBOOK_REF"

      - name: Build Sphinx tutorials
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Assemble site
        run: |
          mkdir -p _site/tutorials
          cp index.html style.css script.js background@2x.png diaggraph.png _site/
          cp -R docs/_build/html/. _site/tutorials/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
